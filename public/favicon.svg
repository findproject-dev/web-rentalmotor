<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#17191C"/>
  <!-- Motorcycle wheel left -->
  <circle cx="16" cy="44" r="8" stroke="#F47B35" stroke-width="3" fill="none"/>
  <!-- Motorcycle wheel right -->
  <circle cx="48" cy="44" r="8" stroke="#F47B35" stroke-width="3" fill="none"/>
  <!-- Body frame -->
  <path d="M24 44 L32 28 L44 32 L48 44" stroke="#F47B35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Handlebar -->
  <path d="M32 28 L40 24" stroke="#F47B35" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Seat area -->
  <path d="M24 36 L38 32" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <!-- Rider dot (head) -->
  <circle cx="34" cy="22" r="3" fill="#F47B35"/>
</svg>